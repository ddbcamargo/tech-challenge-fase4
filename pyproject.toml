[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fase4"
version = "0.9.2"
description = "Protótipo acadêmico de monitoramento multimodal de pacientes fictícios"
requires-python = ">=3.12"
dependencies = ["python-dotenv>=1.2,<2"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "pandas>=2.2", "plotly>=5.24"]
video = ["opencv-python-headless>=4.10", "mediapipe>=0.10"]
azure = ["azure-cognitiveservices-speech>=1.40", "azure-ai-textanalytics>=5.3"]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]
all = [
  "streamlit>=1.50", "pandas>=2.2", "plotly>=5.24",
  "opencv-python-headless>=4.10", "mediapipe>=0.10",
  "azure-cognitiveservices-speech>=1.40", "azure-ai-textanalytics>=5.3",
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12",
  "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2",
  "imageio-ffmpeg>=0.5,<1",
]
downloader = ["yt-dlp>=2025.9", "imageio-ffmpeg>=0.5,<1"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["fase4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

